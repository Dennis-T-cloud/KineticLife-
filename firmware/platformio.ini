[env:freenove_esp32s3_wroom_n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.psram_type = opi

build_flags =
  -D KINETICLIFE_FW_VERSION=\"0.3.0\"
  -D KINETICLIFE_BOARD_MODEL=\"Freenove ESP32-S3-WROOM Board (N16R8) FNK0085 B\"
  -D KINETICLIFE_CAMERA_MODEL=\"OV2640\"
  -D BOARD_HAS_PSRAM
