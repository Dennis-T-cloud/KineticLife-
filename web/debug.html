<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KineticLife — Camera Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #ccc; font: 13px/1.5 monospace;
           display: flex; flex-direction: column; align-items: center; min-height: 100dvh; }

    #canvas { display: block; background: #000;
              width: min(100vw, calc(80dvh * 3 / 4));
              aspect-ratio: 3 / 4;
              }

    /* ── top bar ── */
    .bar { padding: 5px 10px; width: 100%; background: #1e1e1e;
           border-bottom: 1px solid #2b2b2b;
           display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bar input { border: 1px solid #444; background: #202020; color: #ddd;
                 border-radius: 3px; padding: 3px 7px; font: inherit;
                 min-width: min(220px, 100%); flex: 1; }
    .bar button {
      padding: 3px 9px; border: 1px solid #555; background: #2a2a2a;
      color: #ccc; cursor: pointer; border-radius: 3px; font: inherit; white-space: nowrap; }
    .bar button:hover { background: #333; }
    button.on  { border-color: #34d399; color: #34d399; background: #0d2b1f; }
    button.rec { border-color: #f44;    color: #f44; }
    button.nav { border-color: #6b7fa0; color: #6b7fa0; }
    button.end { border-color: #c0392b; color: #c0392b; }
    #fps      { color: #34d399; font-size: 11px; white-space: nowrap; }
    #recCount { color: #f59e0b; font-size: 11px; }
    #status   { display: none; } /* moved to #metrics */

    /* ── metrics bar ── */
    #metrics { width: 100%; padding: 5px 10px; background: #161616;
               border-bottom: 1px solid #2b2b2b;
               display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    .m  { font-size: 12px; white-space: nowrap; }
    .ml { color: #64748b; }
    .mv { color: #e2e8f0; font-weight: bold; display: inline-block; min-width: 4.5ch; text-align: right; }
    #mVis, #mAng { min-width: 5.5ch; }
    #mBytes { min-width: 6ch; }

    /* ── joint angles ── */
    #angles { width: 100%; padding: 6px 10px; display: grid;
              grid-template-columns: repeat(2, 1fr); gap: 1px 20px; background: #181818;
              border-bottom: 1px solid #2b2b2b; }
    .ar { display: flex; justify-content: space-between; }
    .an { color: #888; }
    .av { color: #0f0; min-width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
    .av.null { color: #555; }
    .av.ok   { color: #34d399; }
    .av.warn { color: #f59e0b; }
    .av.bad  { color: #f44636; }

    /* ── cam control ── */
    #camctl { width: 100%; padding: 5px 10px; background: #0e0e0e;
              border-bottom: 1px solid #2b2b2b; display: flex; flex-direction: column; gap: 4px; }
    .cc-row  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 11px; }
    .cc-file { color: #4a5568; min-width: 160px; white-space: nowrap; }
    .cc-pair { display: flex; align-items: center; gap: 3px; }
    .cc-lbl  { color: #64748b; }
    .cc-inp  { background: #202020; border: 1px solid #333; color: #e2e8f0;
               font: 11px monospace; border-radius: 2px; padding: 1px 4px;
               width: 34px; text-align: center; }
    select.cc-inp { width: 80px; }
    .cc-inp.diff  { border-color: #d97706; color: #f59e0b; }
    input[type=number].cc-inp::-webkit-inner-spin-button,
    input[type=number].cc-inp::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number].cc-inp { -moz-appearance: textfield; }
    #ccQ { width: 44px; }
    .mdir   { font-size: 9px; font-weight: normal; margin-left: 1px; }
    .mdir-h { color: #4ade80; }
    .mdir-l { color: #60a5fa; }

    @media (max-width: 500px) {
      .bar input { min-width: 120px; }
    }
  </style>
</head>
<body>

<canvas id="canvas" width="240" height="320"></canvas>

<!-- top bar -->
<div class="bar">
  <input id="camUrl" placeholder="http://192.168.x.x  or  fitcam-xxxxxx.local">
  <button id="camApply">Connect</button>
  <label style="white-space:nowrap; cursor:pointer">
    <input type="checkbox" id="showVideo" checked> raw
  </label>
  <span id="fps">— fps</span>
  <button id="recBtn">⏺ Record</button>
  <span id="recCount"></span>
  <button id="loadRefBtn">📂 Ref</button>
  <input type="file" id="loadRefInput" accept=".json" style="display:none">
  <span id="refName" style="color:#64748b;font-size:11px;white-space:nowrap">no ref</span>
  <span id="status">loading…</span>
  <button id="btnPair" class="nav">← Pair</button>
  <button id="btnEnd"  class="end">End Session</button>
</div>

<!-- metrics bar -->
<div id="metrics">
  <span class="m"><span class="ml">detect<span class="mdir mdir-l">L</span> </span><span class="mv" id="mDetect">—</span></span>
  <span class="m"><span class="ml">avg<span class="mdir mdir-l">L</span> </span><span class="mv" id="mAvg">—</span></span>
  <span class="m"><span class="ml">vis<span class="mdir mdir-h">H</span> </span><span class="mv" id="mVis">—</span></span>
  <span class="m"><span class="ml">ang<span class="mdir mdir-h">H</span> </span><span class="mv" id="mAng">—</span></span>
  <span class="m"><span class="ml">bytes<span class="mdir mdir-l">L</span> </span><span class="mv" id="mBytes">—</span></span>
  <span class="m"><span class="ml">skip<span class="mdir mdir-l">L</span> </span><span class="mv" id="mSkip">—</span></span>
  <span class="m"><span class="ml">mode </span><span class="mv" id="mMode" style="color:#34d399">COLOR</span></span>
  <span class="m"><span class="ml">match<span class="mdir mdir-h">H</span> </span><span class="mv" id="mMatch" style="color:#f59e0b">—</span></span>
</div>

<!-- cam params (current runtime, grouped by source file) -->
<div id="camctl">
  <div class="cc-row">
    <span class="cc-file">camera_init.cpp:171</span>
    <span class="cc-pair"><span class="cc-lbl">res</span>
      <select id="ccRes" class="cc-inp">
        <option value="320x240">320×240</option>
        <option value="640x480">640×480</option>
      </select></span>
    <span class="cc-pair"><span class="cc-lbl">q</span>
      <input id="ccQ" class="cc-inp" type="number" min="4" max="63" value="12"></span>
  </div>
  <div class="cc-row">
    <span class="cc-file">camera_init.cpp:95</span>
    <span class="cc-pair"><span class="cc-lbl">brightness</span><input id="ccBr" class="cc-inp" type="number" min="-2" max="2" value="0"></span>
    <span class="cc-pair"><span class="cc-lbl">contrast</span><input id="ccCo" class="cc-inp" type="number" min="-2" max="2" value="1"></span>
    <span class="cc-pair"><span class="cc-lbl">saturation</span><input id="ccSa" class="cc-inp" type="number" min="-2" max="2" value="0"></span>
    <span class="cc-pair"><span class="cc-lbl">sharpness</span><input id="ccSh" class="cc-inp" type="number" min="-2" max="2" value="1"></span>
    <span class="cc-pair"><span class="cc-lbl">ae_level</span><input id="ccAe" class="cc-inp" type="number" min="-2" max="2" value="0"></span>
    <span class="cc-pair"><span class="cc-lbl">vflip</span><input id="ccVf" class="cc-inp" type="number" min="0" max="1" value="0"></span>
    <span class="cc-pair"><span class="cc-lbl">hmirror</span><input id="ccHm" class="cc-inp" type="number" min="0" max="1" value="0"></span>
    <button id="ccApply" class="cc-btn">Apply</button>
    <button id="ccReset" class="cc-btn" style="color:#888">Reset</button>
  </div>
</div>

<!-- joint angles (14-D per §5) -->
<div id="angles"></div>

<!-- WebSocket video stream — no img element needed -->

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── State ──────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const DEFAULT_URL = "http://fitcam-d37d7c.local";
let camUrl     = params.get("cam") || localStorage.getItem("kineticlife.camUrl") || DEFAULT_URL;
let retryTimer = null;
let wsConn     = null;        // active WebSocket connection
let latestBitmap  = null;     // most recently decoded ImageBitmap
let decodePending = false;    // true while createImageBitmap() is in flight
let pendingData   = null;     // newest raw bytes waiting for a decode slot
let lastFrameBytes = 0;

// ── Cam state (mirrors firmware defaults; updated on Apply / Reset) ────────
const FW = { res:'320x240', q:12, brightness:0, contrast:1, saturation:0, sharpness:1, ae_level:0, vflip:0, hmirror:0 };
let camState = { ...FW };

const CC_IDS = { res:'ccRes', q:'ccQ', brightness:'ccBr', contrast:'ccCo',
                 saturation:'ccSa', sharpness:'ccSh', ae_level:'ccAe', vflip:'ccVf', hmirror:'ccHm' };

function ccHighlight() {
  for (const [k, id] of Object.entries(CC_IDS)) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('diff', String(camState[k]) !== String(FW[k]));
  }
}

function ccReadInputs() {
  return {
    res:        document.getElementById('ccRes').value,
    q:          parseInt(document.getElementById('ccQ').value, 10),
    brightness: parseInt(document.getElementById('ccBr').value, 10),
    contrast:   parseInt(document.getElementById('ccCo').value, 10),
    saturation: parseInt(document.getElementById('ccSa').value, 10),
    sharpness:  parseInt(document.getElementById('ccSh').value, 10),
    ae_level:   parseInt(document.getElementById('ccAe').value, 10),
    vflip:      parseInt(document.getElementById('ccVf').value, 10),
    hmirror:    parseInt(document.getElementById('ccHm').value, 10),
  };
}


// ── Elements ───────────────────────────────────────────────────────────────
const canvas    = document.getElementById("canvas");
const ctx       = canvas.getContext("2d");
const statusEl  = document.getElementById("status");
const showVideo = document.getElementById("showVideo");
const camUrlEl  = document.getElementById("camUrl");
const recBtn    = document.getElementById("recBtn");
const recCount  = document.getElementById("recCount");
const fpsEl     = document.getElementById("fps");
const anglesEl  = document.getElementById("angles");

// ── FPS ────────────────────────────────────────────────────────────────────
const fpsHist = [];
function tickFps(now) {
  fpsHist.push(now);
  while (fpsHist.length && fpsHist[0] < now - 3000) fpsHist.shift();
  fpsEl.textContent = (fpsHist.length / 3).toFixed(1) + " fps";
}

// ── Stream control (WebSocket) ─────────────────────────────────────────────
function normalizeCamUrl(v) {
  const t = v.trim().replace(/\/+$/, "");
  if (!t) return DEFAULT_URL;
  return /^https?:\/\//i.test(t) ? t : `http://${t}`;
}

function wsUrl(httpUrl) {
  return httpUrl.replace(/^http:\/\//i, "ws://") + "/ws";
}

// Decode one raw JPEG ArrayBuffer → latestBitmap.
// At most one decode is in flight at a time. If a new frame arrives while decoding,
// it is stored in pendingData (overwriting any earlier pending frame) and drained
// immediately once the current decode completes. This ensures the pipeline always
// shows the newest frame and never queues more than one extra, preventing latency creep.
function startDecode(data) {
  lastFrameBytes = data.byteLength;
  decodePending = true;
  pendingData   = null;
  createImageBitmap(new Blob([data], { type: "image/jpeg" })).then(bmp => {
    if (latestBitmap) latestBitmap.close(); // release previous GPU texture
    latestBitmap = bmp;
    tickFps(performance.now());             // fps = actual network delivery rate
    decodePending = false;
    if (pendingData) startDecode(pendingData); // drain one-frame backlog
  });
}

function openWs() {
  const url = wsUrl(camUrl);
  const sock = new WebSocket(url);
  wsConn = sock;
  sock.binaryType = "arraybuffer";

  sock.onopen = () => {
    console.log(`[ws] connected ${url}`);
    statusEl.textContent = "connected";
  };

  sock.onmessage = ({ data }) => {
    if (decodePending) {
      pendingData = data; // overwrite: latest frame wins, intermediate frames dropped
      return;
    }
    startDecode(data);
  };

  sock.onclose = () => {
    if (wsConn !== sock) return; // stale — a newer connect() already took over
    wsConn = null;
    console.warn("[ws] closed — retrying in 2 s");
    statusEl.textContent = "stream closed — retrying in 2 s";
    if (retryTimer) clearTimeout(retryTimer);
    retryTimer = setTimeout(applyStream, 2000);
  };

  sock.onerror = () => {
    console.error("[ws] error");
    statusEl.textContent = "WebSocket error";
  };
}

function buildCamQuery() {
  const s = camState;
  return `/cam?res=${s.res}&q=${s.q}&brightness=${s.brightness}&contrast=${s.contrast}&saturation=${s.saturation}&sharpness=${s.sharpness}&ae_level=${s.ae_level}&vflip=${s.vflip}&hmirror=${s.hmirror}`;
}

function applyStream() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  if (wsConn) { wsConn.onclose = null; wsConn.close(); wsConn = null; }
  fpsHist.length = 0;
  fpsEl.textContent = "— fps";
  fetch(`${camUrl}${buildCamQuery()}`, { signal: AbortSignal.timeout(3000) })
    .catch(() => {})
    .finally(() => openWs());
}

function connect(value) {
  camUrl = normalizeCamUrl(value);
  camUrlEl.value = camUrl;
  localStorage.setItem("kineticlife.camUrl", camUrl);
  statusEl.textContent = `connecting → ${camUrl}`;
  applyStream();
}

// ── Camera controls ────────────────────────────────────────────────────────
document.getElementById("camApply").addEventListener("click", () => connect(camUrlEl.value));
camUrlEl.addEventListener("keydown", e => { if (e.key === "Enter") connect(camUrlEl.value); });

// ── Cam control panel ─────────────────────────────────────────────────────
document.getElementById('ccApply').addEventListener('click', () => {
  camState = ccReadInputs();
  ccHighlight();
  fetch(`${camUrl}${buildCamQuery()}`, { signal: AbortSignal.timeout(3000) }).catch(() => {});
});

document.getElementById('ccReset').addEventListener('click', () => {
  camState = { ...FW };
  for (const [k, id] of Object.entries(CC_IDS)) {
    const el = document.getElementById(id);
    if (el) el.value = FW[k];
  }
  ccHighlight();
  fetch(`${camUrl}${buildCamQuery()}`, { signal: AbortSignal.timeout(3000) }).catch(() => {});
});

// ── Navigation ─────────────────────────────────────────────────────────────
document.getElementById("btnPair").addEventListener("click", () => {
  if (wsConn) { wsConn.onclose = null; wsConn.close(); wsConn = null; }
  location.href = "./pair.html";
});

document.getElementById("btnEnd").addEventListener("click", async () => {
  if (wsConn) { wsConn.onclose = null; wsConn.close(); wsConn = null; }
  statusEl.textContent = "ending session — ESP32 rebooting…";
  try {
    await fetch(`${camUrl}/end`, { method: "POST", mode: "cors", signal: AbortSignal.timeout(3000) });
  } catch (_) {}
  localStorage.removeItem("kineticlife.camUrl");
  setTimeout(() => { location.href = "./pair.html"; }, 1000);
});

// ── Joint angle names (§5, indices 0–13) ──────────────────────────────────
const ANGLE_NAMES = [
  "left_knee",  "right_knee",
  "left_elbow", "right_elbow",
  "left_hip",   "right_hip",
  "left_shoulder", "right_shoulder",
  "left_ankle", "right_ankle",
  "left_wrist", "right_wrist",
  "trunk_lean", "pelvis_tilt",
];
ANGLE_NAMES.forEach((name, i) => {
  const row = document.createElement("div");
  row.className = "ar";
  row.innerHTML = `<span class="an">${String(i).padStart(2,"0")} ${name}</span>`
                + `<span class="av null" id="av${i}">—</span>`;
  anglesEl.appendChild(row);
});

// ── Joint angle math (§5) ──────────────────────────────────────────────────
const VIS = 0.3;
function sub(a, b)   { return { x: b.x-a.x, y: b.y-a.y, z: b.z-a.z }; }
function dot(u, v)   { return u.x*v.x + u.y*v.y + u.z*v.z; }
function mag(v)      { return Math.sqrt(dot(v,v)); }
function angleDeg(u, v) {
  const m = mag(u) * mag(v);
  if (m < 1e-9) return NaN;
  return Math.acos(Math.max(-1, Math.min(1, dot(u,v)/m))) * 180 / Math.PI;
}
// angle at joint b between bones a–b and b–c
function jAngle(wl, a, b, c) {
  if (wl[a].visibility < VIS || wl[b].visibility < VIS || wl[c].visibility < VIS) return NaN;
  return angleDeg(sub(wl[b], wl[a]), sub(wl[b], wl[c]));
}

function computeAngles(wl) {
  const [LS,RS,LE,RE,LW,RW] = [11,12,13,14,15,16];
  const [LI,RI]              = [19,20];
  const [LH,RH,LK,RK,LA,RA] = [23,24,25,26,27,28];
  const [LF,RF]              = [31,32];

  const a = new Array(14).fill(NaN);
  a[0]  = jAngle(wl, LH, LK, LA);
  a[1]  = jAngle(wl, RH, RK, RA);
  a[2]  = jAngle(wl, LS, LE, LW);
  a[3]  = jAngle(wl, RS, RE, RW);
  a[4]  = jAngle(wl, LS, LH, LK);
  a[5]  = jAngle(wl, RS, RH, RK);
  a[6]  = jAngle(wl, LH, LS, LE);
  a[7]  = jAngle(wl, RH, RS, RE);
  a[8]  = jAngle(wl, LK, LA, LF);
  a[9]  = jAngle(wl, RK, RA, RF);
  a[10] = jAngle(wl, LE, LW, LI);
  a[11] = jAngle(wl, RE, RW, RI);

  // trunk_lean: spine vs world-up [0,−1,0] (MediaPipe y+ is down)
  if ([LH,RH,LS,RS].every(i => wl[i].visibility >= VIS)) {
    const mH = { x:(wl[LH].x+wl[RH].x)/2, y:(wl[LH].y+wl[RH].y)/2, z:(wl[LH].z+wl[RH].z)/2 };
    const mS = { x:(wl[LS].x+wl[RS].x)/2, y:(wl[LS].y+wl[RS].y)/2, z:(wl[LS].z+wl[RS].z)/2 };
    a[12] = angleDeg(sub(mH, mS), { x:0, y:-1, z:0 });
  }

  // pelvis_tilt: L_HIP→R_HIP vs horizontal [1,0,0]
  if (wl[LH].visibility >= VIS && wl[RH].visibility >= VIS) {
    a[13] = Math.min(45, angleDeg(sub(wl[LH], wl[RH]), { x:1, y:0, z:0 }));
  }

  return a.map(v => isNaN(v) ? null : parseFloat(v.toFixed(1)));
}

// Serialize MediaPipe worldLandmarks to compact [[x,y,z,vis]×33] (contract §3.5)
function serializeLandmarks(wl) {
  return wl.map(lm => [
    parseFloat(lm.x.toFixed(4)),
    parseFloat(lm.y.toFixed(4)),
    parseFloat(lm.z.toFixed(4)),
    parseFloat(lm.visibility.toFixed(2)),
  ]);
}

// ── Recording (JSON frames for DTW reference) ──────────────────────────────
let recording = false, frames = [], frameId = 0;

recBtn.addEventListener("click", () => {
  if (!recording) {
    frames = []; frameId = 0;
    recording = true;
    recBtn.textContent = "⏹ Stop & Save";
    recBtn.classList.add("rec");
    recCount.textContent = "0 frames";
  } else {
    recording = false;
    recBtn.textContent = "⏺ Record";
    recBtn.classList.remove("rec");
    recCount.textContent = "";
    const ts   = new Date().toISOString().replace(/[:.]/g, "-");
    const blob = new Blob([JSON.stringify(frames, null, 2)], { type: "application/json" });
    const a    = document.createElement("a");
    a.href     = URL.createObjectURL(blob);
    a.download = `pose_${ts}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }
});

// ── DTW config ─────────────────────────────────────────────────────────────
const DTW_CFG = {
  WINDOW_SIZE:   60,  // fixed sliding window — ~6.5 s at the ~9 fps camera rate
  COMPARE_EVERY: 15,  // dispatch to worker every N valid detected poses
  GOOD_DEG:       8,  // per-joint avg DTW distance → green
  WARN_DEG:      18,  // per-joint avg DTW distance → yellow (above = red)
  SCORE_MAX_DEG: 30,  // distance at which overall score reaches 0 %
};

// ── DTW state ──────────────────────────────────────────────────────────────
let refFrames       = null;
let dtwBusy         = false;     // worker is processing — skip new dispatches until done
let compareTick     = 0;
let lastJointScores = new Array(14).fill(null);
let lastMatchScore  = null;

// ── DTW Web Worker (inlined Blob — no separate .js file required) ──────────
// Runs the O(N²) DTW computation off the main thread so it cannot stutter
// video rendering or MediaPipe inference regardless of pose sequence length.
const _DTW_SRC = `
function dtw1d(s,t){
  const n=s.length,m=t.length,W=m+1;
  const dp=new Float32Array((n+1)*W).fill(Infinity);
  dp[0]=0;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    const c=Math.abs(s[i-1]-t[j-1]);
    dp[i*W+j]=c+Math.min(dp[(i-1)*W+j],dp[i*W+j-1],dp[(i-1)*W+j-1]);
  }
  let i=n,j=m,len=0;
  while(i>0&&j>0){len++;const a=dp[(i-1)*W+j],b=dp[i*W+j-1],c=dp[(i-1)*W+j-1];
    if(c<=a&&c<=b){i--;j--;}else if(a<=b){i--;}else{j--;}}
  return dp[n*W+m]/Math.max(1,len);
}
self.onmessage=({data})=>{
  const{ref,query,scoreMax}=data,N=14,dists=new Array(N).fill(null);
  let total=0,valid=0;
  for(let j=0;j<N;j++){
    const rs=ref.map(f=>f.joint_angles[j]).filter(v=>v!==null);
    const qs=query.map(f=>f.joint_angles[j]).filter(v=>v!==null);
    if(rs.length<4||qs.length<4) continue;
    const d=dtw1d(rs,qs);dists[j]=d;total+=d;valid++;
  }
  const avg=valid>0?total/valid:Infinity;
  self.postMessage({
    score:valid>0?Math.max(0,Math.round(100*(1-avg/scoreMax))):null,
    jointDists:dists,validJoints:valid
  });
};`;
const dtwWorker = new Worker(
  URL.createObjectURL(new Blob([_DTW_SRC], { type: "application/javascript" }))
);
dtwWorker.onmessage = ({ data }) => {
  dtwBusy        = false;
  lastMatchScore  = data.score;
  lastJointScores = data.jointDists;
  const el = document.getElementById("mMatch");
  if (lastMatchScore === null) {
    el.textContent = "—"; el.style.color = "#f59e0b";
  } else {
    el.textContent  = lastMatchScore + "%";
    el.style.color  = lastMatchScore >= 70 ? "#34d399" : lastMatchScore >= 40 ? "#f59e0b" : "#f44636";
  }
};

// ── Sliding window buffer (fixed-size circular) ────────────────────────────
// Stores the last WINDOW_SIZE pose frames in chronological order.
// Frames with fewer than 8 visible joints are discarded as noise.
const slideWindow = new Array(DTW_CFG.WINDOW_SIZE).fill(null);
let slideHead  = 0;   // next write position
let slideCount = 0;   // valid entries (ramps up until window is full)

function pushToWindow(angles, ts_ms) {
  if (angles.filter(a => a !== null).length < 8) return; // skip low-visibility frame
  slideWindow[slideHead] = { ts_ms, joint_angles: angles };
  slideHead = (slideHead + 1) % DTW_CFG.WINDOW_SIZE;
  if (slideCount < DTW_CFG.WINDOW_SIZE) slideCount++;
}

function getWindowSlice() {
  // Return frames in chronological order (oldest → newest)
  if (slideCount < DTW_CFG.WINDOW_SIZE) return slideWindow.slice(0, slideCount);
  return [...slideWindow.slice(slideHead), ...slideWindow.slice(0, slideHead)];
}

// ── Load reference for DTW ─────────────────────────────────────────────────
const loadRefBtn   = document.getElementById("loadRefBtn");
const loadRefInput = document.getElementById("loadRefInput");
const refNameEl    = document.getElementById("refName");

loadRefBtn.addEventListener("click", () => loadRefInput.click());
loadRefInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!Array.isArray(data) || !data[0]?.joint_angles) throw new Error("bad format");
      refFrames = data;
      slideWindow.fill(null); slideHead = 0; slideCount = 0; // reset window on new ref
      lastJointScores = new Array(14).fill(null);
      lastMatchScore  = null;
      refNameEl.textContent = `${file.name} (${data.length}f)`;
      refNameEl.style.color = "#34d399";
      const mEl = document.getElementById("mMatch");
      mEl.textContent = "—"; mEl.style.color = "#f59e0b";
    } catch (_) {
      refNameEl.textContent = "invalid JSON";
      refNameEl.style.color = "#f44";
    }
  };
  reader.readAsText(file);
  e.target.value = "";
});

// ── MediaPipe init ─────────────────────────────────────────────────────────
let landmarker, drawing;
let lastTick = 0;
let lastDetectMs = 0;
const detectHist = [];   // rolling detect times (last 20 frames)
let tickTotal = 0, tickSkipped = 0;  // for skip-rate display

// Inference canvas portrait 3:4 — matches rotated display
const inferCanvas = document.createElement("canvas");
inferCanvas.width = 120; inferCanvas.height = 160;
const inferCtx = inferCanvas.getContext("2d");

async function init() {
  statusEl.textContent = "loading model…";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const modelAssetPath =
    "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  try {
    landmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath, delegate: "GPU" },
      runningMode: "VIDEO", numPoses: 1,
    });
  } catch (_) {
    statusEl.textContent = "GPU unavailable, using CPU…";
    landmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath, delegate: "CPU" },
      runningMode: "VIDEO", numPoses: 1,
    });
  }
  drawing = new DrawingUtils(ctx);

  // Pre-compile WebGL shaders — eliminates the visible stutter on the first real frames
  statusEl.textContent = "warming up…";
  const warmup = document.createElement("canvas");
  warmup.width = 160; warmup.height = 160;
  for (let i = 0; i < 5; i++) {
    landmarker.detectForVideo(warmup, performance.now());
    await new Promise(r => setTimeout(r, 20));
  }

  statusEl.textContent = "ready";
  requestAnimationFrame(tick);
}

// ── Main loop ──────────────────────────────────────────────────────────────
// VIDEO mode + 160×160 inference canvas targets ~20ms detect → ~20fps.
// Adaptive idle (lastDetectMs+30) keeps TCP buffer from filling on slow frames.
function tick(now) {
  requestAnimationFrame(tick);
  tickTotal++;
  const minInterval = Math.max(50, lastDetectMs + 30);
  if (now - lastTick < minInterval) { tickSkipped++; return; }
  lastTick = now;
  if (!latestBitmap || !landmarker) return;

  // Inference canvas: rotate 90° CW — camera sends 320×240 landscape,
  // inferCanvas is 120×160 portrait (same 3:4 aspect, scaled down).
  inferCtx.save();
  inferCtx.translate(inferCanvas.width, 0);
  inferCtx.rotate(Math.PI / 2);
  inferCtx.drawImage(latestBitmap, 0, 0, inferCanvas.height, inferCanvas.width);
  inferCtx.restore();

  // Display canvas: skip drawImage when raw is off (save GPU blit)
  if (showVideo.checked) {
    ctx.save();
    ctx.translate(canvas.width, 0);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(latestBitmap, 0, 0, canvas.height, canvas.width);
    ctx.restore();
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  const t0 = performance.now();
  const result = landmarker.detectForVideo(inferCanvas, t0);
  lastDetectMs = Math.round(performance.now() - t0);

  // Rolling detect average (last 20 frames)
  detectHist.push(lastDetectMs);
  if (detectHist.length > 20) detectHist.shift();
  const detectAvg = Math.round(detectHist.reduce((a, b) => a + b, 0) / detectHist.length);

  if (result.landmarks.length > 0) {
    drawing.drawConnectors(result.landmarks[0], PoseLandmarker.POSE_CONNECTIONS,
                           { color: "#00ff88", lineWidth: 3 });
    drawing.drawLandmarks(result.landmarks[0], { color: "#ff4466", radius: 5 });

    // Count visible landmarks (visibility > 0.5) for in-frame quality check
    const visCount = result.landmarks[0].filter(p => p.visibility > 0.5).length;

    const angles = computeAngles(result.worldLandmarks[0]);
    const validAngles = angles.filter(v => v !== null).length;
    angles.forEach((val, i) => {
      const el = document.getElementById(`av${i}`);
      if (val === null) {
        el.textContent = "—";
        el.className = "av null";
      } else {
        el.textContent = val + "°";
        const d = lastJointScores[i];
        if (d === null)                    el.className = "av";
        else if (d < DTW_CFG.GOOD_DEG)    el.className = "av ok";
        else if (d < DTW_CFG.WARN_DEG)    el.className = "av warn";
        else                              el.className = "av bad";
      }
    });

    const skipPct = tickTotal > 0 ? Math.round(tickSkipped / tickTotal * 100) : 0;
    document.getElementById("mDetect").textContent = lastDetectMs + "ms";
    document.getElementById("mAvg").textContent    = detectAvg + "ms";
    document.getElementById("mVis").textContent    = visCount + "/33";
    document.getElementById("mAng").textContent    = validAngles + "/14";
    document.getElementById("mBytes").textContent  = lastFrameBytes > 0 ? (lastFrameBytes / 1024).toFixed(1) + "KB" : "—";
    document.getElementById("mSkip").textContent   = skipPct + "%";

    if (recording) {
      frames.push({
        frame_id: frameId++,
        ts_ms: Math.round(now),
        joint_angles: angles,
        world_landmarks: serializeLandmarks(result.worldLandmarks[0]),
      });
      recCount.textContent = `${frames.length} frames`;
    }

    // Push pose to fixed sliding window (visibility-filtered)
    pushToWindow(angles, Math.round(now));

    // Dispatch DTW to background worker — non-blocking; skipped while worker is busy
    // so O(N²) computation never touches the main thread.
    if (refFrames && !dtwBusy && ++compareTick >= DTW_CFG.COMPARE_EVERY && slideCount >= 15) {
      compareTick = 0;
      dtwBusy = true;
      dtwWorker.postMessage({ ref: refFrames, query: getWindowSlice(), scoreMax: DTW_CFG.SCORE_MAX_DEG });
    }
  } else {
    const skipPct = tickTotal > 0 ? Math.round(tickSkipped / tickTotal * 100) : 0;
    document.getElementById("mDetect").textContent = lastDetectMs + "ms";
    document.getElementById("mAvg").textContent    = detectAvg + "ms";
    document.getElementById("mVis").textContent    = "—";
    document.getElementById("mAng").textContent    = "—";
    document.getElementById("mBytes").textContent  = lastFrameBytes > 0 ? (lastFrameBytes / 1024).toFixed(1) + "KB" : "—";
    document.getElementById("mSkip").textContent   = skipPct + "%";
  }
}

// ── Start ──────────────────────────────────────────────────────────────────
camUrlEl.value = camUrl;
connect(camUrl);
init().catch(e => { statusEl.textContent = "error: " + e.message; console.error(e); });
</script>
</body>
</html>
