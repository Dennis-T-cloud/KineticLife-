<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KineticLife — Camera Debug</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; color: #ccc; font: 13px/1.5 monospace;
           display: flex; flex-direction: column; align-items: center; min-height: 100dvh; }

    #canvas { display: block; background: #000;
              width: min(100vw, calc(80dvh * 3 / 4));
              aspect-ratio: 3 / 4;
              }

    /* ── top bar ── */
    .bar { padding: 5px 10px; width: 100%; background: #1e1e1e;
           border-bottom: 1px solid #2b2b2b;
           display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bar input { border: 1px solid #444; background: #202020; color: #ddd;
                 border-radius: 3px; padding: 3px 7px; font: inherit;
                 min-width: min(220px, 100%); flex: 1; }
    .bar button {
      padding: 3px 9px; border: 1px solid #555; background: #2a2a2a;
      color: #ccc; cursor: pointer; border-radius: 3px; font: inherit; white-space: nowrap; }
    .bar button:hover { background: #333; }
    button.on  { border-color: #34d399; color: #34d399; background: #0d2b1f; }
    button.rec { border-color: #f44;    color: #f44; }
    button.nav { border-color: #6b7fa0; color: #6b7fa0; }
    button.end { border-color: #c0392b; color: #c0392b; }
    #fps      { color: #34d399; font-size: 11px; white-space: nowrap; }
    #recCount { color: #f59e0b; font-size: 11px; }
    #status   { display: none; } /* moved to #metrics */

    /* ── metrics bar ── */
    #metrics { width: 100%; padding: 5px 10px; background: #161616;
               border-bottom: 1px solid #2b2b2b;
               display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
    .m  { font-size: 12px; white-space: nowrap; }
    .ml { color: #64748b; }
    .mv { color: #e2e8f0; font-weight: bold; }

    /* ── joint angles ── */
    #angles { width: 100%; padding: 6px 10px; display: grid;
              grid-template-columns: repeat(2, 1fr); gap: 1px 20px; background: #181818;
              border-bottom: 1px solid #2b2b2b; }
    .ar { display: flex; justify-content: space-between; }
    .an { color: #888; }
    .av { color: #0f0; min-width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
    .av.null { color: #555; }

    @media (max-width: 500px) {
      .bar input { min-width: 120px; }
    }
  </style>
</head>
<body>

<canvas id="canvas" width="240" height="320"></canvas>

<!-- top bar -->
<div class="bar">
  <input id="camUrl" placeholder="http://192.168.x.x  or  fitcam-xxxxxx.local">
  <button id="camApply">Connect</button>
  <label style="white-space:nowrap; cursor:pointer">
    <input type="checkbox" id="showVideo" checked> raw
  </label>
  <span id="fps">— fps</span>
  <button id="recBtn">⏺ Record</button>
  <span id="recCount"></span>
  <span id="status">loading…</span>
  <button id="btnPair" class="nav">← Pair</button>
  <button id="btnEnd"  class="end">End Session</button>
</div>

<!-- metrics bar -->
<div id="metrics">
  <span class="m"><span class="ml">detect </span><span class="mv" id="mDetect">—</span></span>
  <span class="m"><span class="ml">avg </span><span class="mv" id="mAvg">—</span></span>
  <span class="m"><span class="ml">vis </span><span class="mv" id="mVis">—</span></span>
  <span class="m"><span class="ml">skip </span><span class="mv" id="mSkip">—</span></span>
  <span class="m"><span class="ml">mode </span><span class="mv" id="mMode" style="color:#34d399">COLOR</span></span>
</div>

<!-- joint angles (14-D per §5) -->
<div id="angles"></div>

<!-- hidden MJPEG source; canvas reads frames from it -->
<img id="mjpeg" crossorigin="anonymous" style="display:none" alt="">

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── State ──────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const DEFAULT_URL = "http://fitcam-d37d7c.local";
let camUrl    = params.get("cam") || localStorage.getItem("kineticlife.camUrl") || DEFAULT_URL;
let retryTimer = null;
let streamReady = false;
// 1×1 transparent GIF — clean disconnect without triggering error event
const BLANK = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";

// ── Elements ───────────────────────────────────────────────────────────────
const img       = document.getElementById("mjpeg");
const canvas    = document.getElementById("canvas");
const ctx       = canvas.getContext("2d");
const statusEl  = document.getElementById("status");
const showVideo = document.getElementById("showVideo");
const camUrlEl  = document.getElementById("camUrl");
const recBtn    = document.getElementById("recBtn");
const recCount  = document.getElementById("recCount");
const fpsEl     = document.getElementById("fps");
const anglesEl  = document.getElementById("angles");

// ── FPS ────────────────────────────────────────────────────────────────────
const fpsHist = [];
function tickFps(now) {
  fpsHist.push(now);
  while (fpsHist.length && fpsHist[0] < now - 3000) fpsHist.shift();
  fpsEl.textContent = (fpsHist.length / 3).toFixed(1) + " fps";
}

// ── Stream control ─────────────────────────────────────────────────────────
function normalizeCamUrl(v) {
  const t = v.trim().replace(/\/+$/, "");
  if (!t) return DEFAULT_URL;
  return /^https?:\/\//i.test(t) ? t : `http://${t}`;
}

function applyStream() {
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
  streamReady = false;
  img.src = BLANK;           // valid URL → no error event; cancels old stream
  fpsHist.length = 0;
  fpsEl.textContent = "— fps";
  setTimeout(() => {
    streamReady = true;
    img.src = `${camUrl}/stream?res=320x240&q=12&brightness=0&ts=${Date.now()}`;
  }, 450);
}

function connect(value) {
  camUrl = normalizeCamUrl(value);
  camUrlEl.value = camUrl;
  localStorage.setItem("kineticlife.camUrl", camUrl);
  statusEl.textContent = `connecting → ${camUrl}`;
  applyStream();
}

img.addEventListener("error", () => {
  statusEl.textContent = `stream failed — retrying in 2 s`;
  if (retryTimer) clearTimeout(retryTimer);
  retryTimer = setTimeout(applyStream, 2000);
});

// ── Camera controls ────────────────────────────────────────────────────────
document.getElementById("camApply").addEventListener("click", () => connect(camUrlEl.value));
camUrlEl.addEventListener("keydown", e => { if (e.key === "Enter") connect(camUrlEl.value); });

// ── Navigation ─────────────────────────────────────────────────────────────
document.getElementById("btnPair").addEventListener("click", () => {
  img.src = BLANK;
  location.href = "./pair.html";
});

document.getElementById("btnEnd").addEventListener("click", async () => {
  img.src = BLANK;
  statusEl.textContent = "ending session — ESP32 rebooting…";
  try {
    await fetch(`${camUrl}/end`, { method: "POST", mode: "cors", signal: AbortSignal.timeout(3000) });
  } catch (_) {}
  localStorage.removeItem("kineticlife.camUrl");
  setTimeout(() => { location.href = "./pair.html"; }, 1000);
});

// ── Joint angle names (§5, indices 0–13) ──────────────────────────────────
const ANGLE_NAMES = [
  "left_knee",  "right_knee",
  "left_elbow", "right_elbow",
  "left_hip",   "right_hip",
  "left_shoulder", "right_shoulder",
  "left_ankle", "right_ankle",
  "left_wrist", "right_wrist",
  "trunk_lean", "pelvis_tilt",
];
ANGLE_NAMES.forEach((name, i) => {
  const row = document.createElement("div");
  row.className = "ar";
  row.innerHTML = `<span class="an">${String(i).padStart(2,"0")} ${name}</span>`
                + `<span class="av null" id="av${i}">—</span>`;
  anglesEl.appendChild(row);
});

// ── Joint angle math (§5) ──────────────────────────────────────────────────
const VIS = 0.3;
function sub(a, b)   { return { x: b.x-a.x, y: b.y-a.y, z: b.z-a.z }; }
function dot(u, v)   { return u.x*v.x + u.y*v.y + u.z*v.z; }
function mag(v)      { return Math.sqrt(dot(v,v)); }
function angleDeg(u, v) {
  const m = mag(u) * mag(v);
  if (m < 1e-9) return NaN;
  return Math.acos(Math.max(-1, Math.min(1, dot(u,v)/m))) * 180 / Math.PI;
}
// angle at joint b between bones a–b and b–c
function jAngle(wl, a, b, c) {
  if (wl[a].visibility < VIS || wl[b].visibility < VIS || wl[c].visibility < VIS) return NaN;
  return angleDeg(sub(wl[b], wl[a]), sub(wl[b], wl[c]));
}

function computeAngles(wl) {
  const [LS,RS,LE,RE,LW,RW] = [11,12,13,14,15,16];
  const [LI,RI]              = [19,20];
  const [LH,RH,LK,RK,LA,RA] = [23,24,25,26,27,28];
  const [LF,RF]              = [31,32];

  const a = new Array(14).fill(NaN);
  a[0]  = jAngle(wl, LH, LK, LA);
  a[1]  = jAngle(wl, RH, RK, RA);
  a[2]  = jAngle(wl, LS, LE, LW);
  a[3]  = jAngle(wl, RS, RE, RW);
  a[4]  = jAngle(wl, LS, LH, LK);
  a[5]  = jAngle(wl, RS, RH, RK);
  a[6]  = jAngle(wl, LH, LS, LE);
  a[7]  = jAngle(wl, RH, RS, RE);
  a[8]  = jAngle(wl, LK, LA, LF);
  a[9]  = jAngle(wl, RK, RA, RF);
  a[10] = jAngle(wl, LE, LW, LI);
  a[11] = jAngle(wl, RE, RW, RI);

  // trunk_lean: spine vs world-up [0,−1,0] (MediaPipe y+ is down)
  if ([LH,RH,LS,RS].every(i => wl[i].visibility >= VIS)) {
    const mH = { x:(wl[LH].x+wl[RH].x)/2, y:(wl[LH].y+wl[RH].y)/2, z:(wl[LH].z+wl[RH].z)/2 };
    const mS = { x:(wl[LS].x+wl[RS].x)/2, y:(wl[LS].y+wl[RS].y)/2, z:(wl[LS].z+wl[RS].z)/2 };
    a[12] = angleDeg(sub(mH, mS), { x:0, y:-1, z:0 });
  }

  // pelvis_tilt: L_HIP→R_HIP vs horizontal [1,0,0]
  if (wl[LH].visibility >= VIS && wl[RH].visibility >= VIS) {
    a[13] = Math.min(45, angleDeg(sub(wl[LH], wl[RH]), { x:1, y:0, z:0 }));
  }

  return a.map(v => isNaN(v) ? null : parseFloat(v.toFixed(1)));
}

// ── Recording (JSON frames for DTW reference) ──────────────────────────────
let recording = false, frames = [], frameId = 0;

recBtn.addEventListener("click", () => {
  if (!recording) {
    frames = []; frameId = 0;
    recording = true;
    recBtn.textContent = "⏹ Stop & Save";
    recBtn.classList.add("rec");
    recCount.textContent = "0 frames";
  } else {
    recording = false;
    recBtn.textContent = "⏺ Record";
    recBtn.classList.remove("rec");
    recCount.textContent = "";
    const ts   = new Date().toISOString().replace(/[:.]/g, "-");
    const blob = new Blob([JSON.stringify(frames, null, 2)], { type: "application/json" });
    const a    = document.createElement("a");
    a.href     = URL.createObjectURL(blob);
    a.download = `pose_${ts}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }
});

// ── MediaPipe init ─────────────────────────────────────────────────────────
let landmarker, drawing;
let lastTick = 0;
let lastDetectMs = 0;
const detectHist = [];   // rolling detect times (last 20 frames)
let tickTotal = 0, tickSkipped = 0;  // for skip-rate display

// Inference canvas portrait 3:4 — matches rotated display
const inferCanvas = document.createElement("canvas");
inferCanvas.width = 120; inferCanvas.height = 160;
const inferCtx = inferCanvas.getContext("2d");

async function init() {
  statusEl.textContent = "loading model…";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  const modelAssetPath =
    "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task";
  try {
    landmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath, delegate: "GPU" },
      runningMode: "VIDEO", numPoses: 1,
    });
  } catch (_) {
    statusEl.textContent = "GPU unavailable, using CPU…";
    landmarker = await PoseLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath, delegate: "CPU" },
      runningMode: "VIDEO", numPoses: 1,
    });
  }
  drawing = new DrawingUtils(ctx);

  // Pre-compile WebGL shaders — eliminates the visible stutter on the first real frames
  statusEl.textContent = "warming up…";
  const warmup = document.createElement("canvas");
  warmup.width = 160; warmup.height = 160;
  for (let i = 0; i < 5; i++) {
    landmarker.detectForVideo(warmup, performance.now());
    await new Promise(r => setTimeout(r, 20));
  }

  statusEl.textContent = "ready";
  requestAnimationFrame(tick);
}

// ── Main loop ──────────────────────────────────────────────────────────────
// VIDEO mode + 160×160 inference canvas targets ~20ms detect → ~20fps.
// Adaptive idle (lastDetectMs+30) keeps TCP buffer from filling on slow frames.
function tick(now) {
  requestAnimationFrame(tick);
  tickTotal++;
  const minInterval = Math.max(50, lastDetectMs + 30);
  if (now - lastTick < minInterval) { tickSkipped++; return; }
  lastTick = now;
  if (!streamReady || !img.complete || img.naturalWidth === 0 || !landmarker) return;

  // Inference canvas always gets the rotated frame
  inferCtx.save();
  inferCtx.translate(inferCanvas.width, 0);
  inferCtx.rotate(Math.PI / 2);
  inferCtx.drawImage(img, 0, 0, inferCanvas.height, inferCanvas.width);
  inferCtx.restore();

  // Display canvas: skip drawImage when raw is off (save GPU blit)
  if (showVideo.checked) {
    ctx.save();
    ctx.translate(canvas.width, 0);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(img, 0, 0, canvas.height, canvas.width);
    ctx.restore();
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  const t0 = performance.now();
  const result = landmarker.detectForVideo(inferCanvas, t0);
  lastDetectMs = Math.round(performance.now() - t0);

  // Rolling detect average (last 20 frames)
  detectHist.push(lastDetectMs);
  if (detectHist.length > 20) detectHist.shift();
  const detectAvg = Math.round(detectHist.reduce((a, b) => a + b, 0) / detectHist.length);

  tickFps(now);

  if (result.landmarks.length > 0) {
    drawing.drawConnectors(result.landmarks[0], PoseLandmarker.POSE_CONNECTIONS,
                           { color: "#00ff88", lineWidth: 3 });
    drawing.drawLandmarks(result.landmarks[0], { color: "#ff4466", radius: 5 });

    // Count visible landmarks (visibility > 0.5) for in-frame quality check
    const visCount = result.landmarks[0].filter(p => p.visibility > 0.5).length;

    const angles = computeAngles(result.worldLandmarks[0]);
    angles.forEach((val, i) => {
      const el = document.getElementById(`av${i}`);
      if (val === null) { el.textContent = "—";       el.className = "av null"; }
      else              { el.textContent = val + "°"; el.className = "av"; }
    });

    const skipPct = tickTotal > 0 ? Math.round(tickSkipped / tickTotal * 100) : 0;
    document.getElementById("mDetect").textContent = lastDetectMs + "ms";
    document.getElementById("mAvg").textContent    = detectAvg + "ms";
    document.getElementById("mVis").textContent    = visCount + "/33";
    document.getElementById("mSkip").textContent   = skipPct + "%";

    if (recording) {
      frames.push({ frame_id: frameId++, ts_ms: Math.round(now), joint_angles: angles });
      recCount.textContent = `${frames.length} frames`;
    }
  } else {
    const skipPct = tickTotal > 0 ? Math.round(tickSkipped / tickTotal * 100) : 0;
    document.getElementById("mDetect").textContent = lastDetectMs + "ms";
    document.getElementById("mAvg").textContent    = detectAvg + "ms";
    document.getElementById("mVis").textContent    = "—";
    document.getElementById("mSkip").textContent   = skipPct + "%";
  }
}

// ── Start ──────────────────────────────────────────────────────────────────
camUrlEl.value = camUrl;
connect(camUrl);
init().catch(e => { statusEl.textContent = "error: " + e.message; console.error(e); });
</script>
</body>
</html>
