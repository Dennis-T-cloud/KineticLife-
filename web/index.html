<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KineticLife</title>
    <meta http-equiv="refresh" content="0; url=./pair.html" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f7fb;
        color: #172033;
        font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 480px);
        display: grid;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.1;
      }
      p {
        margin: 0;
        color: #50617c;
      }
      nav {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      a {
        display: block;
        padding: 12px 14px;
        border: 1px solid #bac6d8;
        border-radius: 6px;
        background: #fff;
        color: #1f6f52;
        font-weight: 800;
        text-decoration: none;
      }
      a:hover {
        border-color: #1f6f52;
      }
    </style>
    <script>
      window.location.replace("./pair.html");
    </script>
  </head>
  <body>
    <main>
      <h1>KineticLife</h1>
      <p>Opening the pairing page...</p>
      <nav aria-label="Fallback navigation">
        <a href="./pair.html">Pair ESP32</a>
        <a href="./debug.html">Open Camera Debug</a>
        <a href="./demo.html">Open Demo Mode</a>
      </nav>
    </main>
  </body>
</html>
