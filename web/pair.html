<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>KineticLife Pair</title>
  <script src="./vendor/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; background: #f5f7fb; color: #172033;
           font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(960px, 100%); margin: 0 auto; padding: 24px 16px 40px;
           display: grid; gap: 20px; }
    h1 { margin: 0; font-size: 34px; line-height: 1.05; letter-spacing: 0; }
    p { margin: 0; color: #50617c; }
    .version { display: inline-flex; align-items: center; width: fit-content; border-radius: 999px;
               padding: 4px 9px; background: #dff7ed; color: #176043; font-weight: 800; font-size: 12px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 460px); gap: 22px; align-items: start; }
    .form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 700; color: #2a3953; }
    input, select, button { font: inherit; }
    input, select { width: 100%; border: 1px solid #bac6d8; border-radius: 6px;
                    padding: 12px 13px; color: #172033; background: #fff; }
    button { border: 0; border-radius: 6px; padding: 12px 14px; color: #fff;
             background: #1f6f52; font-weight: 800; cursor: pointer; }
    button.secondary { background: #24324a; }
    .notice { border: 1px solid #b8d6c8; background: #eef8f3; color: #1f5c43;
              border-radius: 6px; padding: 12px; }
    .warning { border: 1px solid #ead292; background: #fff8e4; color: #76590d;
               border-radius: 6px; padding: 10px; }
    .qrBox { min-height: 460px; border: 1px solid #dde4ef; border-radius: 8px;
             background: #fff; display: grid; place-items: center; padding: 20px;
             box-shadow: 0 18px 40px rgba(33, 49, 77, 0.12); }
    #qr { width: 420px; height: 420px; display: grid; place-items: center; color: #697891; font-weight: 800; text-align: center; }
    #qr canvas, #qr img { width: 420px; height: 420px; display: block; image-rendering: pixelated; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-all; background: #172033;
          color: #dbe7f6; border-radius: 6px; padding: 12px; font-size: 12px; }
    .actions { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr; }
      #qr, #qr canvas, #qr img { width: min(420px, 92vw); height: min(420px, 92vw); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p>KineticLife session setup</p>
      <h1>Pair ESP32 by WiFi QR</h1>
      <div class="version">Compact QR v3</div>
    </header>

    <section class="grid">
      <div class="form">
        <label>Hotspot SSID
          <input id="ssid" placeholder="Phone-hotspot-name" autocomplete="off">
        </label>

        <label>Security
          <select id="type">
            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="nopass">No password</option>
          </select>
        </label>

        <label>Password
          <input id="password" type="password" placeholder="Hotspot password" autocomplete="off">
        </label>

        <div class="notice">Compact QR v3. Use a 2.4 GHz hotspot, avoid spaces in the SSID, set screen brightness around 70-90%, then adjust distance until ESP32 logs span_px near 100.</div>
        <div id="warnings"></div>
        <pre id="payload">K1:W:&lt;SSID_LEN&gt;:&lt;SSID&gt;&lt;PASSWORD&gt;</pre>

        <label>Camera address after ESP32 connects
          <input id="camUrl" placeholder="http://fitcam-xxxxxx.local">
        </label>

        <div class="actions">
          <button id="openCam">Open Camera</button>
          <button class="secondary" id="refreshQr">Refresh QR</button>
        </div>
      </div>

      <div class="qrBox">
        <div id="qr">Enter SSID</div>
      </div>
    </section>
  </main>

  <script>
    const ssidEl = document.getElementById("ssid");
    const typeEl = document.getElementById("type");
    const passwordEl = document.getElementById("password");
    const payloadEl = document.getElementById("payload");
    const warningsEl = document.getElementById("warnings");
    const qrEl = document.getElementById("qr");
    const camUrlEl = document.getElementById("camUrl");

    ssidEl.value = localStorage.getItem("kineticlife.pair.ssid") || "";
    typeEl.value = localStorage.getItem("kineticlife.pair.type") || "WPA";
    passwordEl.value = localStorage.getItem("kineticlife.pair.password") || "";
    camUrlEl.value = localStorage.getItem("kineticlife.camUrl") || "http://fitcam-d37d7c.local";

    function compactTypeCode(type) {
      if (type === "nopass") return "N";
      if (type === "WEP") return "E";
      return "W";
    }

    function buildPayload() {
      const ssid = ssidEl.value.trim();
      const password = typeEl.value === "nopass" ? "" : passwordEl.value;
      return `K1:${compactTypeCode(typeEl.value)}:${ssid.length}:${ssid}${password}`;
    }

    function normalizeCamUrl(value) {
      const trimmed = value.trim().replace(/\/+$/, "");
      if (!trimmed) return "http://fitcam-d37d7c.local";
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return `http://${trimmed}`;
    }

    function updateQr() {
      localStorage.setItem("kineticlife.pair.ssid", ssidEl.value);
      localStorage.setItem("kineticlife.pair.type", typeEl.value);
      localStorage.setItem("kineticlife.pair.password", passwordEl.value);

      const payload = buildPayload();
      const ssid = ssidEl.value.trim();
      payloadEl.textContent = ssid ? payload : "K1:W:<SSID_LEN>:<SSID><PASSWORD>";
      passwordEl.disabled = typeEl.value === "nopass";

      const warnings = [];
      if (/[^\x20-\x7e]/.test(ssid + passwordEl.value)) warnings.push("Use ASCII-only SSID/password for the compact QR format.");
      if (/\s/.test(ssid)) warnings.push("SSID contains a space. ESP32 decoded it, but hotspot discovery is often more reliable after renaming the hotspot without spaces.");
      if (typeEl.value === "WPA" && passwordEl.value && passwordEl.value.length < 8) warnings.push("WPA passwords are usually 8 characters or longer.");
      warningsEl.innerHTML = warnings.map((item) => `<div class="warning">${item}</div>`).join("");

      qrEl.innerHTML = "";
      if (!ssid) {
        qrEl.textContent = "Enter SSID";
        return;
      }
      if (!window.QRCode) {
        qrEl.textContent = "QR library failed to load";
        return;
      }
      new window.QRCode(qrEl, {
        text: payload,
        width: 420,
        height: 420,
        colorDark: "#111111",
        colorLight: "#ffffff",
        correctLevel: window.QRCode.CorrectLevel.L
      });
    }

    [ssidEl, typeEl, passwordEl].forEach((el) => el.addEventListener("input", updateQr));
    document.getElementById("refreshQr").addEventListener("click", updateQr);
    document.getElementById("openCam").addEventListener("click", () => {
      const camUrl = normalizeCamUrl(camUrlEl.value);
      localStorage.setItem("kineticlife.camUrl", camUrl);
      location.href = `./debug.html?cam=${encodeURIComponent(camUrl)}`;
    });
    updateQr();
  </script>
</body>
</html>
